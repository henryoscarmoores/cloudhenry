<!-- CH_SIGNIN_PAGE: Portal's own sign-in box offers a Sign up that skips the airport. Sign in happens on /sign-in/ instead. -->
<script>(function(){var here=location.pathname;if(/^\/sign-in\/?$/.test(here))return;function route(h){if(!h||h.indexOf("#/portal")<0)return null;if(/#\/portal\/signin/.test(h))return "/sign-in/";if(/#\/portal\/signup/.test(h))return "/choose-city/";return null;}function go(h){var to=route(h);if(!to)return false;if(to==="/choose-city/"&&/^\/join-/.test(here))return false;location.replace(to);return true;}if(go(location.hash))return;window.addEventListener("hashchange",function(){go(location.hash);});document.addEventListener("click",function(e){var a=e.target.closest?e.target.closest("a[href],[data-portal]"):null;if(!a)return;var h=a.getAttribute("href")||"";var d=a.getAttribute("data-portal");if(d!==null&&/^signin/.test(d||""))h="#/portal/signin";var to=route(h);if(to!=="/sign-in/")return;e.preventDefault();e.stopPropagation();location.href=to;},true);})();</script>
