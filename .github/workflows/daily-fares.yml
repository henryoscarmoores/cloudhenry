# Refreshes CloudHenry's fares in the cloud, every morning.
#
# This exists so the site does not depend on Henry's PC being switched on.
# The Windows scheduled task does the same work locally; either can run and
# the other will simply find nothing to commit.
#
# The API token lives in the repository secret TRAVELPAYOUTS_TOKEN and is
# written to .token at runtime. .token is gitignored, so it can never be
# committed, and GitHub masks the value in logs.

name: Daily fare refresh

on:
  schedule:
    # Twice a day, 05:00 and 17:00 UTC, so the site never sits on prices
    # more than twelve hours old. GitHub runs schedules in UTC only.
    - cron: "0 5,17 * * *"
  workflow_dispatch:        # lets Henry run it by hand from the Actions tab

permissions:
  contents: write           # needed to push the refreshed fares back

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 170

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Write the API token
        shell: pwsh
        env:
          TP_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          if (-not $env:TP_TOKEN) {
            throw "TRAVELPAYOUTS_TOKEN secret is not set. Add it under Settings, Secrets and variables, Actions."
          }
          # Trim it. The first cloud run failed every call with a 401
          # because the stored secret carried one character more than the
          # key, and a stray space is invisible in the Actions UI.
          $tok = $env:TP_TOKEN.Trim()
          Set-Content -Path ".token" -Value $tok -NoNewline -Encoding ascii
          Write-Host "token written, $($tok.Length) characters"

      # One script now does the lot: every destination the cache knows
      # from each airport, one file per airport, plus the slim fares.json
      # the homepage and join pages read.
      - name: Build fares
        shell: powershell
        run: .\build-fares.ps1 -MonthsAhead 3

      # A destination the site cannot name is hidden, so name the new ones
      # from Travelpayouts' own city list before publishing.
      - name: Name new destinations
        shell: powershell
        continue-on-error: true
        run: .\name-places.ps1

      - name: Check the result before publishing
        shell: pwsh
        run: |
          if (-not (Test-Path "fares.json")) { throw "fares.json is missing" }
          $j = Get-Content "fares.json" -Raw | ConvertFrom-Json
          $count = @($j.fares).Count
          $size  = (Get-Item "fares.json").Length
          Write-Host "routes: $count, size: $size bytes"
          # Refuse to publish a thin file rather than empty the site.
          if ($count -lt 100) { throw "only $count routes, refusing to publish" }
          if ($size -lt 100000) { throw "file is only $size bytes, refusing to publish" }

          # A destination with no entry in places.js has no city name and
          # no flag, so the site hides it. Two codes disappeared that way
          # once. Say so rather than losing the routes quietly.
          $names = Get-Content "places.js" -Raw
          $missing = @($j.fares | ForEach-Object { $_.destination } | Sort-Object -Unique |
                       Where-Object { $names -notmatch ("(?m)\b" + [regex]::Escape($_) + ":\[") })
          if ($missing.Count -gt 0) {
            Write-Host "::warning::No city name for: $($missing -join ', '). Add them to places.js."
          } else {
            Write-Host "every destination has a name"
          }

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fares.json fares-*.json places.js
          if (-not (git status --porcelain fares.json fares-*.json places.js)) {
            Write-Host "no change since the last run"
            exit 0
          }
          $count = @((Get-Content "fares.json" -Raw | ConvertFrom-Json).fares).Count
          git commit -m "Refresh fares $(Get-Date -Format 'yyyy-MM-dd')" -m "$count routes across 12 UK airports." -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          # The run takes the best part of an hour; main may have moved.
          git pull --rebase origin main
          git push

      - name: Clear the CDN cache
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($f in @("fares.json", "places.js") + @(Get-ChildItem "fares-*.json" | ForEach-Object { $_.Name })) {
            Invoke-WebRequest -Uri "https://purge.jsdelivr.net/gh/henryoscarmoores/cloudhenry@main/$f" -UseBasicParsing -TimeoutSec 60 | Out-Null
          }
          Write-Host "purged"

      - name: Remove the token
        if: always()
        shell: pwsh
        run: Remove-Item ".token" -ErrorAction SilentlyContinue
